name: TP data pipeline

on:
  push:
    paths:
      - "tp/**"
      - ".github/workflows/tp-data.yml"
  pull_request:
    paths:
      - "tp/**"
      - ".github/workflows/tp-data.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
